<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=1920"><title>B300 · film</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(980px,100% - 32px);margin:64px auto 96px}

:root{--ink:#18181a;--muted:#8c8c90;--soft:#b4b4b8;--line:#e6e6e3;--page:#f7f7f6;--serif:"EB Garamond","Noto Serif SC",Georgia,serif;--sans:Inter,"Noto Sans SC","WenQuanYi Zen Hei",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;--blue:#2f6fe4;--red:#e5484d}
html,body{margin:0;background:var(--page)!important;overflow:hidden}
.film{position:fixed;inset:0;width:1920px;height:1080px;background:var(--page);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
.film *{box-sizing:border-box}
.intro{position:absolute;inset:0;pointer-events:none}
.thumb{position:absolute;width:190px;border-radius:2px;background:#fff;box-shadow:0 0 0 1px #0000000d,0 6px 16px -8px #0000002a;overflow:hidden}
.thumb img{display:block;width:100%}
.intro-line{position:absolute;left:0;right:0;top:470px;text-align:center;font-family:var(--serif);font-size:84px;letter-spacing:-.01em;line-height:1.1}
.card{position:absolute;left:230px;top:128px;width:1460px;height:822px;background:#fff;box-shadow:0 0 0 1px #0000000f,0 30px 60px -30px #0000002e,0 12px 24px -14px #00000012}
.ask{position:absolute;inset:0;padding:56px 68px}
.ask-head{display:flex;justify-content:space-between;color:var(--muted);font-size:21px;padding-bottom:20px;border-bottom:2px solid var(--line)}
.ask-text{position:absolute;left:68px;right:160px;top:300px;font-size:40px;line-height:1.45;letter-spacing:-.005em}
.ask-text .cmd{font-weight:600}
.ask-text .caret{display:inline-block;width:3px;height:1.05em;background:var(--ink);vertical-align:-0.15em;margin-left:3px}
.ask-gt{position:absolute;left:68px;top:300px;font-size:40px;color:var(--soft);transform:translateX(-46px)}
.ask-send{position:absolute;right:68px;bottom:62px;width:68px;height:68px;background:#f0f0ee;display:grid;place-items:center;color:var(--muted);font-size:30px}
.view{position:absolute;inset:0}
.chip-prompt{position:absolute;left:44px;top:44px;max-width:1040px;padding:15px 24px;background:#f2f2f0;color:#55555a;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-prompt b{color:var(--ink);font-weight:600}
.pills{position:absolute;right:54px;top:60px;display:flex;gap:26px;font-size:19px;color:var(--soft)}
.pills span{display:inline-flex;align-items:center;gap:9px}
.pills i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--soft)}
.pills .on{color:var(--ink)}
.pills .on i{background:var(--ink);box-shadow:none}
.slot{position:absolute;left:150px;top:96px;width:760px}
.slot .iso-page{width:auto}
.slot .iso-figure{margin:0}
.slot .iso-plate{padding:0!important;background:transparent!important;box-shadow:none!important;overflow:visible!important}
.slot .iso-plate-corners,.slot .b3-controls,.slot figcaption{display:none!important}
.slot .b3-stage:focus,.slot .b3-stage:focus-visible{outline:none!important}
.iso[data-theme="light"]{--anatomy-card:#ffffff;--anatomy-paper:#ffffff}
.panel{position:absolute;left:970px;top:146px;width:440px}
.no{font-size:21px;color:var(--muted)}
.title{font-family:var(--serif);font-size:84px;line-height:.98;margin-top:6px;letter-spacing:-.01em}
.subtitle{font-family:var(--serif);font-style:italic;font-size:66px;line-height:1;color:#8a8a8f}
.status{margin-top:40px;font-size:23px;color:var(--muted);white-space:nowrap;height:30px}
.status b{color:var(--ink);font-weight:500}
.big{display:flex;align-items:baseline;gap:18px;height:146px;margin-top:4px}
.big .n{font-family:var(--serif);font-size:156px;line-height:1;letter-spacing:-.02em;font-variant-numeric:lining-nums}
.big .u{font-family:var(--serif);font-style:italic;font-size:44px;color:#8a8a8f;white-space:nowrap}
.big .u.sans{font-family:var(--sans);font-style:normal;font-size:23px}
.big.red .n{color:var(--red)}
.bar{position:relative;display:flex;gap:6px;height:7px;margin-top:22px}
.bar .seg{position:relative;height:100%;background:#eeeeec;overflow:hidden}
.bar .seg i{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0)}
.bar .seg.red i{background:var(--red)}
.under{margin-top:16px;font-size:22px;color:#55555a;height:28px;white-space:nowrap}
.controls{margin-top:30px;display:grid;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row .k{width:62px;font-size:17px;color:var(--muted)}
.fc{padding:6px 14px;border-radius:999px;font-family:var(--mono);font-size:16px;color:var(--muted);box-shadow:inset 0 0 0 1px #00000017;background:#fff}
.fc.on{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.fc.act{font-family:var(--sans);font-size:15px;color:var(--ink)}
.fc.press{background:#ececea}
.caption{position:absolute;left:236px;top:986px;display:flex;align-items:baseline;gap:16px;font-size:26px;white-space:nowrap}
.caption .num{font-family:var(--mono);font-size:15px;color:var(--muted);padding:3px 7px;box-shadow:inset 0 0 0 1px #0000001a;transform:translateY(-3px)}
.caption .b{color:var(--ink);font-weight:500}
.caption .g{color:var(--soft)}
.cursor{position:absolute;left:0;top:0;width:34px;height:34px;pointer-events:none;filter:drop-shadow(0 2px 3px #0003)}
.outro{position:absolute;inset:0;text-align:center;pointer-events:none}
.outro h1{position:absolute;left:0;right:0;top:300px;margin:0;font-family:var(--serif);font-weight:400;font-size:196px;letter-spacing:-.015em}
.outro p{position:absolute;left:0;right:0;top:618px;margin:0;font-size:31px;color:var(--muted)}
.outro p b{color:var(--ink);font-weight:500}
.outro .install{position:absolute;left:50%;top:700px;transform:translateX(-50%);padding:22px 34px;background:#fff;font-family:var(--mono);font-size:30px;color:var(--ink);box-shadow:0 0 0 1px #0000000f,0 14px 30px -18px #00000033}
.outro .install span{color:var(--muted)}
.outro small{position:absolute;left:0;right:0;top:822px;font-size:18px;color:var(--soft)}

      <div class="slot" id="slot"><style>.b3 {
  --b3-ink: #5aa9ff;
  --b3-ink-hi: #b9dcff;
  --b3-scan: #eaf5ff;
  --b3-over: var(--anatomy-red);
  --b3-blend: screen;
  --b3-button-hover: #232323;
  --b3-button-ring: #ffffff14;
  --b3-chip-ring: #ffffff12;
  --b3-chip-on: #ffffff10;
  --b3-lamp-off: #4a4a4a;
  --b3-top0: var(--anatomy-top);
  --b3-sh0: var(--anatomy-shade-0);
  --b3-sh1: var(--anatomy-shade-1);
  --b3-sh2: var(--anatomy-shade-2);
  --b3-sh3: var(--anatomy-shade-3);
  --b3-hi0: var(--anatomy-hi);
  --b3-mid0: var(--anatomy-mid);
}

[data-theme="light"] .b3 {
  --b3-ink: #2f6fe4;
  --b3-ink-hi: #0b3fa8;
  --b3-scan: #0a46d8;
  --b3-blend: normal;
  --b3-button-hover: #f0f0ed;
  --b3-button-ring: #0000001a;
  --b3-chip-ring: #00000014;
  --b3-chip-on: #0000000a;
  --b3-lamp-off: #c4c4c4;
}

.b3 .iso-plate {
  padding: 52px 24px 64px;
  overflow: hidden;
}

.b3-stage {
  position: relative;
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

.b3-stage:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 6px;
}

.b3-stage > svg,
.b3-stage > canvas {
  display: block;
  width: 100%;
  height: auto;
}

.b3-glow {
  position: absolute;
  inset: 0;
  height: 100% !important;
  pointer-events: none;
  mix-blend-mode: var(--b3-blend);
}

/* Weights stored in a memory layer: tint by how full it is (--f), brighten while read (--s). */
.it[data-stack] {
  --f: 0;
  --s: 0;
  --anatomy-top: color-mix(in srgb, var(--b3-ink) calc(var(--f) * var(--b3-w, 1) * 34% + var(--s) * var(--b3-w, 1) * 40%), var(--b3-top0));
  --anatomy-shade-0: color-mix(in srgb, var(--b3-ink) calc(var(--f) * var(--b3-w, 1) * 22% + var(--s) * var(--b3-w, 1) * 50%), var(--b3-sh0));
  --anatomy-shade-1: color-mix(in srgb, var(--b3-ink) calc(var(--f) * var(--b3-w, 1) * 24% + var(--s) * var(--b3-w, 1) * 52%), var(--b3-sh1));
  --anatomy-shade-2: color-mix(in srgb, var(--b3-ink) calc(var(--f) * var(--b3-w, 1) * 26% + var(--s) * var(--b3-w, 1) * 54%), var(--b3-sh2));
  --anatomy-shade-3: color-mix(in srgb, var(--b3-ink) calc(var(--f) * var(--b3-w, 1) * 28% + var(--s) * var(--b3-w, 1) * 56%), var(--b3-sh3));
  --anatomy-hi: color-mix(in srgb, var(--b3-scan) calc(var(--s) * var(--b3-w, 1) * 90%), color-mix(in srgb, var(--b3-ink-hi) calc(var(--f) * var(--b3-w, 1) * 55%), var(--b3-hi0)));
  --anatomy-mid: color-mix(in srgb, var(--b3-scan) calc(var(--s) * var(--b3-w, 1) * 90%), color-mix(in srgb, var(--b3-ink) calc(var(--f) * var(--b3-w, 1) * 50%), var(--b3-mid0)));
}

.b3-stage[data-over] .it[data-stack] {
  --anatomy-hi: color-mix(in srgb, var(--b3-over) 70%, var(--b3-hi0));
  --anatomy-mid: color-mix(in srgb, var(--b3-over) 50%, var(--b3-mid0));
}

/* A finished token: the two dies flash (the SVG half of the glow, also the no-WebGL fallback). */
.it[data-die] {
  --anatomy-top: color-mix(in srgb, var(--b3-ink) calc(var(--flash, 0) * var(--b3-w, 1) * 45%), var(--b3-top0));
  --anatomy-hi: color-mix(in srgb, var(--b3-ink-hi) calc(var(--flash, 0) * var(--b3-w, 1) * 80%), var(--b3-hi0));
}

.b3-stage[data-focus] .it:not([data-on]):not([data-piece="stand"]) {
  --anatomy-hi: var(--anatomy-mid);
  --anatomy-mid: var(--anatomy-lo);
  --b3-hi0: var(--b3-mid0);
}

.b3-stage[data-focus] .it[data-piece="stand"] {
  --anatomy-mid: var(--anatomy-lo);
}

.it[data-on] {
  --anatomy-hi: var(--anatomy-lit);
  --anatomy-mid: var(--anatomy-hi);
  --b3-hi0: var(--anatomy-lit);
}

.it[data-on]:not([data-stack]) .iso-top {
  fill: var(--anatomy-lit-top);
}

.it[data-on]:not([data-stack]) .iso-shade {
  fill: var(--anatomy-lit-shade);
}

.b3-controls {
  position: absolute;
  left: 20px;
  bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--anatomy-mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--anatomy-muted);
}

.b3-act {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 28px;
  padding: 0 13px;
  border: 0;
  border-radius: 999px;
  background: var(--anatomy-face);
  color: var(--anatomy-strong);
  font: inherit;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--b3-button-ring);
  transition: background 200ms var(--anatomy-ease), transform 160ms var(--anatomy-ease);
}

.b3-act:hover {
  background: var(--b3-button-hover);
}

.b3-act:active {
  transform: scale(0.97);
}

.b3-act:focus-visible,
.b3-chip:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 3px;
}

.b3-lamp {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--b3-lamp-off);
  transition: background 240ms var(--anatomy-ease), box-shadow 240ms var(--anatomy-ease);
}

.b3-act[data-state="on"] .b3-lamp {
  background: var(--b3-ink);
  box-shadow: 0 0 9px 1px color-mix(in srgb, var(--b3-ink) 55%, transparent);
}

.b3-choose {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 22px;
  margin-bottom: 6px;
}

.b3-group {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.b3-label {
  margin-right: 4px;
  font-family: var(--anatomy-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--anatomy-muted);
}

.b3-chip {
  padding: 5px 11px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--anatomy-muted);
  font: 12.5px/1.3 var(--anatomy-mono);
  cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--b3-chip-ring);
  transition: color 160ms var(--anatomy-ease), background 160ms var(--anatomy-ease);
}

.b3-chip:hover,
.b3-chip[data-on] {
  color: var(--anatomy-strong);
  background: var(--b3-chip-on);
}

.b3-chip[data-on] {
  box-shadow: inset 0 0 0 1px var(--anatomy-mid);
}

.b3-live {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

@media (max-width: 640px) {
  .b3 .iso-plate {
    padding: 48px 8px 88px;
  }

  .b3 .iso-plate-corner[data-corner="readout"] {
    bottom: 46px;
    right: 0;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .b3-controls {
    left: 14px;
    bottom: 14px;
    gap: 8px;
    max-width: calc(100% - 28px);
    flex-wrap: wrap;
  }

  .b3-hint {
    display: none;
  }

  .b3-stage {
    width: 118%;
    margin-left: -9%;
  }
}

@media (prefers-reduced-motion: reduce) {
  .b3 * {
    transition: none !important;
  }
}

  if (event.pointerType === "touch") return;

  clearTimeout(leaveTimer);
  quietTour();
  select(pieceAt(event));
  run();
});

stage.addEventListener("pointerleave", () => {
  inside = false;
  clearTimeout(leaveTimer);
  leaveTimer = setTimeout(() => !inside && select(null), 260);
});

stage.addEventListener("pointerdown", (event) => {
  if (event.pointerType !== "touch") return;
  quietTour();
  const id = pieceAt(event);
  select(id && id !== selected ? id : null);
  run();
});

openButton.addEventListener("click", () => {

  setOpen(!open);
  announce(open ? "opening" : "closing");
});

apartButton.addEventListener("click", () => {
  quietTour();
  setApart(!apart);
  announce(apart ? "taking apart" : "putting together");
});

modelChips.forEach((chip, index) =>
  chip.addEventListener("click", () => {

    if (!open) setOpen(true);
    choose(index, precisionIndex);
  }),
);
precisionChips.forEach((chip, index) =>
  chip.addEventListener("click", () => {
    quietTour();
    if (!open) setOpen(true);
    choose(modelIndex, index);
  }),
);

stage.addEventListener("keydown", (event) => {
  let handled = true;
  if (event.key === "ArrowRight") choose(modelIndex + 1, precisionIndex);
  else if (event.key === "ArrowLeft") choose(modelIndex - 1, precisionIndex);
  else if (event.key === "ArrowUp") choose(modelIndex, precisionIndex + 1);
  else if (event.key === "ArrowDown") choose(modelIndex, precisionIndex - 1);
  else if (event.key === "Home") choose(0, precisionIndex);
  else if (event.key === "End") choose(D.models.length - 1, precisionIndex);
  else if (event.key === "o" || event.key === "O") setOpen(!open);
  else if (event.key === " ") setApart(!apart);
  else if (event.key === "Escape") {
    select(null);
    setOpen(false);

  if (!handled) return;
  event.preventDefault();
  quietTour();
  run();

stage.addEventListener("focus", () => (live.textContent = current().readout));
if (still.matches) {

  setOpen(true);
}

sync();
place();

</script><script type="module">// The film's timeline. render(t) draws the whole frame for time t (seconds); the figure runs

const TEXT = {"introA":"说一个想法","introB":"它就变成一台机器","youType":"你输入","tool":"Claude Code","prompt":"/anatomy 用一台真实的机器讲清楚：大模型在 B300 上逐字生成，为什么被 HBM 带宽卡住，可交互","promptChip":"/anatomy","pills":["SVG","WebGL","3D"],"number":"No. 1","title":"B300","subtitle":"token by token","drawing":"绘制","partsOf":"/ {n}","lines":"代码 {n} / {total} 行","ceiling":"上限","noFit":"装不下","memory":"显存 {n} / 288 GB","over":"比 288 GB 多出 {n} GB","model":"模型","weights":"精度","open":"打开冷板","apart":"拆开","pieces":{"stand":"工作台","board":"主板","substrate":"封装基板","interposer":"中介层","dies":"两颗 GPU 裸片","hbm":"HBM3e 堆栈","fan":"HBM3e 堆栈","lid":"液冷冷板"},"partSay":{"hbm":"8 个 HBM3e 堆栈 · 288 GB · 8 TB/s","fan":"1 个堆栈 = 基底 die + 12 层 × 3 GB","dies":"两颗接近光罩极限的裸片 · 软件里是一颗 GPU","interposer":"CoWoS-L 中介层 · 硅桥连接裸片和 HBM","substrate":"封装基板 · 加强框和去耦电容","lid":"液冷冷板 · 压在裸片和 8 个堆栈上"},"steps":[["01","你只输入一句话。","大白话，在 Claude Code 里。"],["02","Claude 把机器画出来。","一个零件一个零件，共 247 个。"],["03","权重装进显存。","读取带扫完一遍，就吐出一个 token。"],["04","你换模型、换精度。","带宽不变，上限只看权重有多大。"],["05","拆开看。","8 个 HBM3e 堆栈，每个 12 层 × 3 GB。"]],"outroTitle":"Anatomy","outroLine":"说出一个想法，Claude 造出解释它的那台机器。","install":"npx skills add wheresryan22/anatomy","credit":"B300 示例由 Claude Code 和 anatomy skill 生成 · 数字见 model.mjs"};
const LINES = 1095;
const DURATION = 45;

const $ = (selector) => document.querySelector(selector);
const $$ = (selector) => [...document.querySelectorAll(selector)];
const clamp = (x, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, x));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const span = (t, a, b) => clamp((t - a) / (b - a));
const window_ = (t, a, b, c, d) => Math.min(ease(span(t, a, b)), 1 - ease(span(t, c, d)));
const fill = (template, values) => template.replace(/\{(\w+)\}/g, (_, key) => values[key]);
const fmt = (n) => Math.round(n).toLocaleString("en-US");
const set = (el, key, value) => {
  if (el.__last?.[key] === value) return;
  (el.__last ??= {})[key] = value;
  if (key === "html") el.innerHTML = value;
  else if (key === "text") el.textContent = value;
  else el.style.setProperty(key, value);

// ---------------------------------------------------------------- the figure
const stage = $(".b3-stage");
const readout = $("[data-readout]");
const figModel = $$("[data-model]");
const figPrecision = $$("[data-precision]");
const figOpen = $("[data-open]");
const figApart = $("[data-apart]");
const ORDER = ["stand", "board", "substrate", "interposer", "dies", "hbm", "fan", "lid"];
const nodes = $$(".b3-items .it").sort((a, b) => ORDER.indexOf(a.dataset.piece) - ORDER.indexOf(b.dataset.piece) || Number(a.dataset.i) - Number(b.dataset.i));
const halo = $(".b3-svg > .iso-halo");
const counts = ORDER.map((id) => nodes.filter((node) => node.dataset.piece === id).length);
const TOTAL = nodes.length;

const key = (k) => stage.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true }));
const hover = (x, y) => stage.dispatchEvent(new PointerEvent("pointermove", { clientX: x, clientY: y, pointerType: "mouse", bubbles: true }));
hover(1, 1);
key("ArrowDown");
stage.style.setProperty("--b3-w", "0");

// ---------------------------------------------------------------- the frame
const askText = $("#askText");
const bigN = $("#bigN");
const bigU = $("#bigU");
const big = $("#big");
const bar = $("#bar");
const under = $("#under");
const status = $("#status");
const cursor = $("#cursor");
const filmChip = (kind, index) => $(`[data-${kind}="${index}"]`);

let barMode = "";
function barFor(mode) {
  if (barMode === mode) return;
  barMode = mode;
  bar.innerHTML = mode === "build" ? counts.map((c) => `<span class="seg" style="flex:${c}"><i></i></span>`).join("") : `<span class="seg" style="flex:1"><i></i></span>`;
}

// What the figure reports: the decode ceiling of the chosen model and precision.
let decode = { model: "70B", precision: "FP16", gb: 140, tok: 57, fits: true, over: 0 };
function readDecode() {
  const text = readout.textContent;
  const m = text.match(/^(\d+B) · (FP\d+) · ([\d.,]+) GB · (?:≤ ([\d,]+) tok\/s|([\d,]+) GB over 288)/);
  if (!m) return;
  const num = (s) => Number(s.replace(/,/g, ""));
  decode = { model: m[1], precision: m[2], gb: num(m[3]), tok: m[4] ? num(m[4]) : 0, fits: !!m[4], over: m[5] ? num(m[5]) : 0 };
}

// The cursor's script: where it goes, and what it presses when it gets there.
const CLICKS = [
  { at: 17.7, el: () => filmChip("fa", "open"), act: () => figOpen.click() },
  { at: 25.4, el: () => filmChip("fp", 1), act: () => figPrecision[1].click() },
  { at: 27.4, el: () => filmChip("fp", 2), act: () => figPrecision[2].click() },
  { at: 29.8, el: () => filmChip("fm", 2), act: () => figModel[2].click() },

const HOVER_FROM = 36.6;
const HOVER_TO = 39.6;
const centreOf = (el) => {
  const r = el.getBoundingClientRect();
  return [r.left + r.width / 2, r.top + r.height / 2];
};

  const boxes = $$('.it[data-piece="fan"]').map((el) => el.getBoundingClientRect());
  const left = Math.min(...boxes.map((b) => b.left));
  const right = Math.max(...boxes.map((b) => b.right));
  const top = Math.min(...boxes.map((b) => b.top));
  const bottom = Math.max(...boxes.map((b) => b.bottom));
  return [left + (right - left) * 0.55, top + (bottom - top) * 0.45];

let fired = 0;
let pos = [1500, 1000];
let shown = { n: 0 };
let lastT = 0;

function render(t) {

}

render(0);
